<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Economía Doméstica</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>


  <div id="cabecera">
    <h1>Gestión de Gastos de la Casa</h1>
    <p>Haz clic sobre la imagen de cada gasto para registrar un pago.</p>
  </div>


  <div id="zona-conceptos">


    <div class="tarjeta" data-id="0">
      <img src="img/luz-energetica.jpg" alt="Luz">
      <div class="nombre-concepto">Luz</div>
      <div class="precio-concepto">60 €</div>
    </div>

   
    <div class="tarjeta" data-id="1">
      <img src="img/Agua.jpg" alt="Agua">
      <div class="nombre-concepto">Agua</div>
      <div class="precio-concepto">25 €</div>
    </div>

  
    <div class="tarjeta" data-id="2">
      <img src="img/Gas.jpg" alt="Gas">
      <div class="nombre-concepto">Gas</div>
      <div class="precio-concepto">45 €</div>
    </div>


    <div class="tarjeta" data-id="3">
      <img src="img/Internet.jpg" alt="Internet">
      <div class="nombre-concepto">Internet</div>
      <div class="precio-concepto">35 €</div>
    </div>


    <div class="tarjeta" data-id="4">
      <img src="img/Comunidad.jpg" alt="Comunidad">
      <div class="nombre-concepto">Comunidad</div>
      <div class="precio-concepto">50 €</div>
    </div>


    <div class="tarjeta" data-id="5">
      <img src="img/Alquiler.jpg" alt="Alquiler">
      <div class="nombre-concepto">Alquiler</div>
      <div class="precio-concepto">550 €</div>
    </div>


    <div class="tarjeta" data-id="6">
      <img src="img/SuperMercado.jpg" alt="Supermercado">
      <div class="nombre-concepto">Supermercado</div>
      <div class="precio-concepto">80 €</div>
    </div>


    <div class="tarjeta" data-id="7">
      <img src="img/Transporte.jpg" alt="Transporte">
      <div class="nombre-concepto">Transporte</div>
      <div class="precio-concepto">30 €</div>
    </div>


    <div class="tarjeta" data-id="8">
      <img src="img/Seguro.jpg" alt="Seguros">
      <div class="nombre-concepto">Seguros</div>
      <div class="precio-concepto">40 €</div>
    </div>


    <div class="tarjeta" data-id="9">
      <img src="img/Mantenimiento.jpg" alt="Mantenimiento">
      <div class="nombre-concepto">Mantenimiento</div>
      <div class="precio-concepto">20 €</div>
    </div>

  </div>


  <div id="bloque-boton">
    <button id="boton-finalizar" type="button">Finalizar trámite y ver resumen</button>
  </div>


  <div id="caja-resumen"></div>

  <script src="js/app.js"></script>
</body>
</html>
